<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | NOURYS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <style>
    :root{ --bg:#f3f5f7; --card:#fff; --line:#e4e7eb; --text:#1f2933; --muted:#616e7c; --brand:#0c6873; --brand2:#10808a; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Cairo',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px 12px 40px; }
    .wrap{ max-width:1200px; margin:0 auto; }
    .card{ background:var(--card); border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); padding:16px; }
    .btn{ padding:8px 14px; border:0; border-radius:9px; font:inherit; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; }
    .btn.ghost{ background:#fff; color:var(--brand); border:1px solid #cbd2d9; }
    .btn.danger{ background:#fff; color:#c0392b; border:1px solid #f1c4c0; padding:6px 10px; }
    .btn:disabled{ opacity:.6; cursor:wait; }
    input, select, textarea{ font:inherit; padding:8px 10px; border:1px solid #cbd2d9; border-radius:9px; background:#fff; }
    .ltr{ direction:ltr; unicode-bidi:isolate; }
    .err{ color:#c0392b; font-size:14px; min-height:20px; margin-top:8px; }

    /* الدخول */
    #loginBox{ max-width:380px; margin:70px auto; }
    #loginBox h2{ margin-bottom:12px; }
    #loginBox label{ display:block; font-weight:600; font-size:14px; margin-bottom:10px; }
    #loginBox input{ display:block; width:100%; margin-top:5px; direction:ltr; }
    #loginBox .btn{ width:100%; padding:11px; }

    /* الرأس والتبويبات */
    .top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .top h1{ font-size:21px; }
    .live{ font-size:13px; font-weight:600; color:var(--muted); margin-right:6px; }
    .live.on{ color:#1b7f3b; }
    .tabs{ display:flex; gap:6px; margin-bottom:14px; }
    .tab{ padding:8px 16px; border-radius:999px; border:1px solid #cbd2d9; background:#fff; font:inherit; font-weight:600; cursor:pointer; }
    .tab.on{ background:var(--brand); color:#fff; border-color:var(--brand); }

    /* العدادات */
    .stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
    .stat{ background:#fff; border-radius:12px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.07); cursor:pointer; border:2px solid transparent; }
    .stat.on{ border-color:var(--brand2); }
    .stat small{ color:var(--muted); font-size:13px; }
    .stat b{ display:block; font-size:26px; line-height:1.2; }

    .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .filters input{ flex:1; min-width:180px; }

    /* الجداول */
    .table-wrap{ overflow-x:auto; }
    table{ width:100%; border-collapse:collapse; font-size:14px; min-width:900px; }
    th, td{ padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); vertical-align:middle; }
    th{ background:#f0f4f8; font-size:13px; white-space:nowrap; }
    td small{ display:block; color:var(--muted); font-size:12px; }
    .empty{ text-align:center; color:var(--muted); padding:24px; }
    .phone a{ color:var(--text); text-decoration:none; }
    .wa{ display:inline-block; margin:0 10px; font-size:12px; color:#1b7f3b; text-decoration:none; font-weight:600; }
    select.status{ font-size:13px; font-weight:700; padding:5px 8px; }
    select.status[data-s="Nouvelle"]{ background:#fff7e6; color:#b7791f; }
    select.status[data-s="Confirmée"]{ background:#e6f6ec; color:#1b7f3b; }
    select.status[data-s="En livraison"]{ background:#e6f0ff; color:#1d4ed8; }
    select.status[data-s="Au bureau"]{ background:#f3e8ff; color:#7e22ce; }
    select.status[data-s="Livrée"]{ background:#e8f5f6; color:#0c6873; }
    select.status[data-s="Retour"]{ background:#fff1e6; color:#c2410c; }
    select.status[data-s="Annulée"]{ background:#fde8e8; color:#c0392b; }
    .saved{ font-size:12px; margin-right:4px; }
    tr.flash td{ animation:flash 2s ease-out; }
    @keyframes flash{ from{ background:#fff3c4; } to{ background:transparent; } }

    /* المنتجات */
    .add{ display:grid; grid-template-columns:2fr 1fr 1fr 2fr auto; gap:8px; margin-bottom:12px; }
    td input{ width:100%; min-width:80px; }
    @media (max-width:760px){
      .stats{ grid-template-columns:repeat(3,1fr); }
      .add{ grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ============ الدخول ============ -->
  <div id="loginBox" class="card">
    <h2>🔐 لوحة التحكم</h2>
    <form id="loginForm">
      <label>البريد الإلكتروني <input name="email" type="email" required autocomplete="username"></label>
      <label>كلمة السر <input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" id="loginBtn">دخول</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- ============ اللوحة ============ -->
  <div id="dash" hidden>
    <div class="top">
      <h1>📦 لوحة التحكم <span id="live" class="live">⚪ جاري الاتصال…</span></h1>
      <div>
        <button class="btn" id="refreshBtn">🔄 تحديث</button>
        <button class="btn ghost" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="orders">الطلبيات</button>
      <button class="tab" data-tab="products">المنتجات</button>
    </div>

    <!-- الطلبيات -->
    <section id="tab-orders">
      <div class="stats" id="stats"></div>
      <div class="filters">
        <input id="search" type="search" placeholder="🔎 بحث بالاسم، الهاتف ولا الولاية">
      </div>
      <div class="card table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>الزبون</th><th>الهاتف</th><th>الولاية</th><th>المنتج</th><th>المجموع</th><th>الحالة</th><th></th></tr></thead>
          <tbody id="orders"><tr><td colspan="8" class="empty">جاري التحميل…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- المنتجات -->
    <section id="tab-products" hidden>
      <div class="card">
        <form class="add" id="addProduct">
          <input name="name" required placeholder="اسم المنتج">
          <input name="price" required type="number" min="0" placeholder="السعر">
          <input name="old_price" type="number" min="0" placeholder="السعر القديم">
          <input name="image_url" type="url" placeholder="رابط الصورة (اختياري)" class="ltr">
          <button class="btn">+ زيد</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>الاسم</th><th>الوصف</th><th>السعر</th><th>السعر القديم</th><th>نشط</th><th></th></tr></thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="err" id="dashErr"></div>
  </div>
</div>

<script>
  // ---------- 1) الاتصال ----------
  const db = supabase.createClient(
    "https://wlpapvirtacrmcxcevuk.supabase.co",
    "sb_publishable_z8EeZip-KzTc6jbDVVNfsg_YWo4fFDs"
  );
  const STATUSES = ["Nouvelle", "Confirmée", "En livraison", "Au bureau", "Livrée", "Retour", "Annulée"];
  const COUNTERS = [["الكل", null], ["الجديدة", "Nouvelle"], ["المؤكدة", "Confirmée"], ["في التوصيل", "En livraison"], ["المسلّمة", "Livrée"]];
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("fr-DZ") + " دج");
  let orders = [], statusFilter = null;

  function showError(text) { $("dashErr").textContent = text || ""; }

  // ---------- 2) الدخول والخروج ----------
  function showDash(on) {
    $("loginBox").hidden = on;
    $("dash").hidden = !on;
    if (on) { loadOrders(); loadProducts(); startLive(); } else { stopLive(); }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    $("loginBtn").disabled = true; $("loginErr").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: f.get("email").trim(), password: f.get("password") });
    $("loginBtn").disabled = false;
    if (error) { $("loginErr").textContent = "الدخول ما نجحش: " + error.message; return; }
    showDash(true);
  });
  $("logoutBtn").addEventListener("click", async () => { await db.auth.signOut(); showDash(false); });

  // ---------- 3) التبويبات ----------
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    $("tab-orders").hidden = t.dataset.tab !== "orders";
    $("tab-products").hidden = t.dataset.tab !== "products";
  }));

  // ---------- 4) الطلبيات ----------
  async function loadOrders() {
    $("refreshBtn").disabled = true;
    const { data, error } = await db.from("orders").select("*").order("created_at", { ascending: false });
    $("refreshBtn").disabled = false;
    if (error) { showError("ما قدرناش نجيبو الطلبيات: " + error.message); return; }
    showError("");
    orders = data;
    renderStats();
    renderOrders();
  }

  // العدادات (وكي تضغط على وحدة، تفلتر الجدول)
  function renderStats() {
    const box = $("stats"); box.innerHTML = "";
    for (const [label, st] of COUNTERS) {
      const n = st ? orders.filter((o) => o.status === st).length : orders.length;
      const d = document.createElement("div");
      d.className = "stat" + (statusFilter === st ? " on" : "");
      d.innerHTML = "<small></small><b></b>";
      d.querySelector("small").textContent = label;
      d.querySelector("b").textContent = n;
      d.addEventListener("click", () => { statusFilter = st; renderStats(); renderOrders(); });
      box.appendChild(d);
    }
  }

  function renderOrders(flashId) {
    const q = $("search").value.trim().toLowerCase();
    const list = orders.filter((o) =>
      (!statusFilter || o.status === statusFilter) &&
      (!q || [o.name, o.phone, o.wilaya, o.commune].join(" ").toLowerCase().includes(q)));
    const tb = $("orders"); tb.innerHTML = "";
    if (!list.length) { tb.innerHTML = '<tr><td colspan="8" class="empty">ما كاين حتى طلبية.</td></tr>'; return; }

    for (const o of list) {
      const tr = tb.insertRow();
      if (o.id === flashId) tr.className = "flash";
      const date = new Date(o.created_at);

      // نستعملو textContent ديما باش حتى كود HTML من الزبون ما يتنفذ
      cell(tr, date.toLocaleDateString("fr-DZ"), date.toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" }), "ltr");
      cell(tr, o.name, o.notes || "");
      const ph = tr.insertCell(); ph.className = "phone ltr";
      const a = document.createElement("a"); a.href = "tel:" + o.phone; a.textContent = o.phone; ph.appendChild(a);
      const wa = document.createElement("a"); wa.className = "wa"; wa.target = "_blank"; wa.rel = "noopener";
      wa.href = "https://wa.me/213" + String(o.phone || "").replace(/^0/, ""); wa.textContent = "واتساب"; ph.appendChild(wa);
      cell(tr, o.wilaya, [o.commune, o.address].filter(Boolean).join(" · "));
      cell(tr, o.product || "", "× " + (o.quantity || 1));
      cell(tr, fmt(o.price));
      tr.insertCell().appendChild(statusSelect(o));
      const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "🗑";
      del.title = "حذف"; del.addEventListener("click", () => deleteOrder(o));
      tr.insertCell().appendChild(del);
    }
  }

  function cell(tr, main, sub, cls) {
    const td = tr.insertCell();
    if (cls) td.className = cls;
    td.append(document.createTextNode(main ?? ""));
    if (sub) { const s = document.createElement("small"); s.textContent = sub; td.appendChild(s); }
  }

  // القائمة المنسدلة تاع الحالة: التبديل يتحفظ في Supabase
  function statusSelect(o) {
    const wrap = document.createElement("span");
    const sel = document.createElement("select"); sel.className = "status";
    const mark = document.createElement("span"); mark.className = "saved";
    STATUSES.forEach((s) => sel.add(new Option(s, s)));
    sel.value = o.status; sel.dataset.s = o.status;
    sel.addEventListener("change", async () => {
      const before = o.status, after = sel.value;
      sel.disabled = true; mark.textContent = "⏳";
      const { error } = await db.from("orders").update({ status: after }).eq("id", o.id);
      sel.disabled = false;
      if (error) { sel.value = before; mark.textContent = "❌"; showError("الحالة ما تحفظتش: " + error.message); return; }
      o.status = after; sel.dataset.s = after; mark.textContent = "✓";
      setTimeout(() => (mark.textContent = ""), 1500);
      renderStats();
    });
    wrap.append(sel, mark);
    return wrap;
  }

  async function deleteOrder(o) {
    if (!confirm("تحذف الطلبية تاع " + o.name + "؟")) return;
    const { error } = await db.from("orders").delete().eq("id", o.id);
    if (error) { showError("ما تحذفتش: " + error.message); return; }
    orders = orders.filter((x) => x.id !== o.id);
    renderStats(); renderOrders();
  }

  $("search").addEventListener("input", () => renderOrders());
  $("refreshBtn").addEventListener("click", () => { loadOrders(); loadProducts(); });

  // ---------- 5) المنتجات ----------
  async function loadProducts() {
    const { data, error } = await db.from("products").select("*").order("id");
    if (error) { showError("ما قدرناش نجيبو المنتجات: " + error.message); return; }
    const tb = $("products"); tb.innerHTML = "";
    if (!data.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">ما كاين حتى منتج. زيد واحد من الفوق.</td></tr>'; return; }
    for (const p of data) {
      const tr = tb.insertRow();
      tr.insertCell().textContent = p.id;
      const name = input(tr, p.name), desc = input(tr, p.description || ""),
            price = input(tr, p.price, "number"), old = input(tr, p.old_price ?? "", "number");
      const act = document.createElement("input"); act.type = "checkbox"; act.checked = p.active;
      tr.insertCell().appendChild(act);
      const save = document.createElement("button"); save.className = "btn"; save.textContent = "حفظ";
      save.addEventListener("click", async () => {
        save.disabled = true;
        const { error } = await db.from("products").update({
          name: name.value.trim(), description: desc.value.trim() || null,
          price: Number(price.value), old_price: old.value === "" ? null : Number(old.value), active: act.checked
        }).eq("id", p.id);
        save.disabled = false;
        save.textContent = error ? "❌" : "✓ تحفظ";
        if (error) showError("المنتج ما تحفظش: " + error.message);
        setTimeout(() => (save.textContent = "حفظ"), 1500);
      });
      tr.insertCell().appendChild(save);
    }
  }

  function input(tr, value, type) {
    const i = document.createElement("input"); if (type) i.type = type; i.value = value;
    tr.insertCell().appendChild(i); return i;
  }

  $("addProduct").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await db.from("products").insert({
      name: f.get("name").trim(), price: Number(f.get("price")),
      old_price: f.get("old_price") ? Number(f.get("old_price")) : null,
      image_url: f.get("image_url") || null
    });
    if (error) { showError("المنتج ما تزادش: " + error.message); return; }
    e.target.reset(); loadProducts();
  });

  // ---------- 6) التحديث المباشر (Realtime) ----------
  let channel = null, timer = null;
  function stopLive() { if (channel) { db.removeChannel(channel); channel = null; } }
  function startLive() {
    stopLive();
    channel = db.channel("orders-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, (payload) => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          await loadOrders();
          if (payload.eventType === "INSERT") {
            renderOrders(payload.new && payload.new.id);
            document.title = "🔔 طلبية جديدة!";
            setTimeout(() => (document.title = "لوحة التحكم | NOURYS"), 4000);
          }
        }, 300);
      })
      .subscribe((s) => {
        const l = $("live");
        if (s === "SUBSCRIBED") { l.textContent = "🟢 مباشر"; l.className = "live on"; }
        else if (["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(s)) { l.textContent = "🔴 غير متصل"; l.className = "live"; }
      });
  }

  // ---------- 7) أول ما تتحل الصفحة ----------
  db.auth.getSession().then(({ data }) => showDash(!!data.session));
</script>
</body>
</html>
