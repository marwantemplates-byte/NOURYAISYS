<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة التحكم | LALLA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%234B1E3A'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23E9CFA0'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/lalla.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <style>
    body{padding:0 0 40px}
    .wrap{max-width:1280px}
    .card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
    .abtn{min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;background:var(--plum);color:#FFF8F2}
    .abtn:hover{background:var(--plum-2)}
    .abtn.ghost{background:transparent;color:var(--plum);border-color:#D9C7BA}
    .abtn.ghost:hover{border-color:var(--plum)}
    .abtn.danger{background:transparent;color:var(--err);border-color:#EBC4C1;min-width:44px;padding:0 12px}
    .abtn:disabled{opacity:.6;cursor:wait}
    input,select,textarea{font:inherit;min-height:40px;padding:6px 10px;border:1px solid #D9C7BA;border-radius:var(--r-sm);background:var(--paper);color:var(--ink)}
    input:focus,select:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px rgba(75,30,58,.15)}
    .err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
    .err:empty{display:block}

    .bar{background:var(--plum);color:#F7EDE6}
    .bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap}
    .bar .brand .word{color:#F7EDE6;font-size:24px}
    .bar .brand .tag{color:#D9BC8A}

    #loginBox{max-width:400px;margin:56px auto;padding:28px}
    #loginBox h2{font-size:30px;margin-bottom:16px}
    #loginBox label{display:grid;gap:6px;font-weight:700;font-size:14px;margin-bottom:14px}
    #loginBox input{width:100%;min-height:48px;direction:ltr}
    #loginBox .abtn{width:100%;min-height:50px}

    .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-block:20px 14px}
    .top h1{font-size:32px}
    .top .actions{display:flex;gap:8px}
    .live{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);margin-inline-start:8px;display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
    .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#C9B8AE}
    .live.on{color:var(--ok)}.live.on::before{background:var(--ok)}
    .live.off{color:var(--err)}.live.off::before{background:var(--err)}
    .tabs{display:flex;gap:6px;margin-bottom:14px}
    .tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #D9C7BA;background:var(--paper);font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
    .tab.on{background:var(--plum);color:#FFF8F2;border-color:var(--plum)}

    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:right;font:inherit;color:inherit}
    .stat.on{border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum)}
    .stat small{color:var(--muted);font-size:13px;display:block}
    .stat b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1;color:var(--plum);font-variant-numeric:tabular-nums}

    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .filters input{flex:1;min-width:200px;min-height:44px}

    .table-wrap{overflow-x:auto;position:relative}
    table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
    th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
    th{background:var(--nude);font-size:13px;white-space:nowrap;color:var(--plum)}
    td small{display:block;color:var(--muted);font-size:12px}
    .empty{text-align:center;color:var(--muted);padding:24px}
    .phone a{color:var(--ink);text-decoration:none}
    .wa{display:inline-block;margin:0 10px;font-size:12px;color:var(--ok);text-decoration:none;font-weight:700}
    .pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--nude);color:var(--plum)}
    .pill.bureau{background:#EFE3F0}
    select.status{font-size:13px;font-weight:700;min-height:36px}
    select.status[data-s="Nouvelle"]{background:#FFF4E2;color:#8A5A12}
    select.status[data-s="Confirmée"]{background:#E7F3EC;color:#245C40}
    select.status[data-s="En livraison"]{background:#E8EEFB;color:#2D4B9A}
    select.status[data-s="Au bureau"]{background:#F2E8F7;color:#6A2C82}
    select.status[data-s="Livrée"]{background:#F3E9EF;color:var(--plum)}
    select.status[data-s="Retour"]{background:#FDEEE5;color:#9A4314}
    select.status[data-s="Annulée"]{background:#FBEAEA;color:var(--err)}
    .saved{font-size:12px;margin-inline-start:4px}
    tr.flash td{animation:flash 2s ease-out}
    @keyframes flash{from{background:#F6E2D8}to{background:transparent}}

    .add{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:8px;margin-bottom:12px}
    td input,td select{width:100%;min-width:80px}
    td input[type=checkbox]{min-height:auto;width:20px;height:20px;min-width:0;accent-color:var(--plum)}
    td .thumb{width:44px;height:54px;border-radius:8px;object-fit:cover;background:var(--nude)}
    @media (max-width:760px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .stats .stat:first-child{grid-column:1/-1}
      .add{grid-template-columns:1fr 1fr}
      .add input[name=name],.add input[name=image_url]{grid-column:1/-1}
    }
  </style>
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="brand" href="../index.html" aria-label="LALLA، المتجر"><span class="word">LALLA</span><span class="tag">Espace marchande</span></a>
  <span style="font-size:14px;color:#E3CFC6">لوحة التحكم</span>
</div></div>
<div class="wrap">

  <!-- ============ الدخول ============ -->
  <div id="loginBox" class="card">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني <input id="email" name="email" type="email" required autocomplete="username"></label>
      <label for="password">كلمة السر <input id="password" name="password" type="password" required autocomplete="current-password"></label>
      <button class="abtn" id="loginBtn">دخول</button>
    </form>
    <div class="err" id="loginErr" role="alert"></div>
  </div>

  <!-- ============ اللوحة ============ -->
  <div id="dash" hidden>
    <div class="top">
      <h1>الطلبيات والمنتجات <span id="live" class="live">جاري الاتصال…</span></h1>
      <div class="actions">
        <button class="abtn" id="refreshBtn">تحديث</button>
        <button class="abtn ghost" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="orders" role="tab" aria-selected="true">الطلبيات</button>
      <button class="tab" data-tab="products" role="tab" aria-selected="false">المنتجات</button>
    </div>

    <!-- الطلبيات -->
    <section id="tab-orders">
      <div class="stats" id="stats"></div>
      <div class="filters">
        <input id="search" type="search" aria-label="بحث" placeholder="بحث بالاسم، الهاتف، الولاية ولا البلدية">
      </div>
      <div class="card table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>الزبونة</th><th>الهاتف</th><th>الولاية / البلدية</th><th>التوصيل</th><th>المنتج</th><th>المجموع</th><th>الحالة</th><th><span class="sr-only">حذف</span></th></tr></thead>
          <tbody id="orders"><tr><td colspan="9" class="empty">جاري التحميل…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- المنتجات -->
    <section id="tab-products" hidden>
      <div class="card">
        <form class="add" id="addProduct">
          <input name="name" required placeholder="اسم المنتج" aria-label="اسم المنتج">
          <input name="price" required type="number" min="0" placeholder="السعر" aria-label="السعر">
          <input name="old_price" type="number" min="0" placeholder="السعر القديم" aria-label="السعر القديم">
          <select name="category" aria-label="الفئة" id="addCat"></select>
          <input name="image_url" type="url" placeholder="رابط الصورة (اختياري)" class="ltr" aria-label="رابط الصورة">
          <button class="abtn">+ إضافة</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>صورة</th><th>الاسم</th><th>الوصف</th><th>الفئة</th><th>السعر</th><th>السعر القديم</th><th>رابط الصورة</th><th>جديد</th><th>الأكثر طلبًا</th><th>نشط</th><th></th></tr></thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="err" id="dashErr" role="alert"></div>
  </div>
</div>

<script>
  // ---------- 1) الاتصال ----------
  const db = supabase.createClient(
    "https://wlpapvirtacrmcxcevuk.supabase.co",
    "sb_publishable_z8EeZip-KzTc6jbDVVNfsg_YWo4fFDs"
  );
  const CATS = [["", "—"], ["sacs", "حقائب"], ["bijoux", "مجوهرات"], ["montres", "ساعات"], ["lunettes", "نظارات"], ["foulards", "أوشحة وشعر"]];
  let hasProductCols = false; // true once supabase/01_lalla_columns.sql has been run
  const STATUSES = ["Nouvelle", "Confirmée", "En livraison", "Au bureau", "Livrée", "Retour", "Annulée"];
  const COUNTERS = [["الكل", null], ["الجديدة", "Nouvelle"], ["المؤكدة", "Confirmée"], ["في التوصيل", "En livraison"], ["المسلّمة", "Livrée"]];
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("fr-DZ") + " دج");
  let orders = [], statusFilter = null;

  function showError(text) { $("dashErr").textContent = text || ""; }

  // ---------- 2) الدخول والخروج ----------
  function showDash(on) {
    $("loginBox").hidden = on;
    $("dash").hidden = !on;
    if (on) { loadOrders(); loadProducts(); startLive(); } else { stopLive(); }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    $("loginBtn").disabled = true; $("loginErr").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: f.get("email").trim(), password: f.get("password") });
    $("loginBtn").disabled = false;
    if (error) { $("loginErr").textContent = "الدخول ما نجحش: " + error.message; return; }
    showDash(true);
  });
  $("logoutBtn").addEventListener("click", async () => { await db.auth.signOut(); showDash(false); });

  // ---------- 3) التبويبات ----------
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => { x.classList.toggle("on", x === t); x.setAttribute("aria-selected", String(x === t)); });
    $("tab-orders").hidden = t.dataset.tab !== "orders";
    $("tab-products").hidden = t.dataset.tab !== "products";
  }));

  // ---------- 4) الطلبيات ----------
  async function loadOrders() {
    $("refreshBtn").disabled = true;
    const { data, error } = await db.from("orders").select("*").order("created_at", { ascending: false });
    $("refreshBtn").disabled = false;
    if (error) { showError("ما قدرناش نجيبو الطلبيات: " + error.message); return; }
    showError("");
    orders = data;
    renderStats();
    renderOrders();
  }

  // العدادات (وكي تضغط على وحدة، تفلتر الجدول)
  function renderStats() {
    const box = $("stats"); box.innerHTML = "";
    for (const [label, st] of COUNTERS) {
      const n = st ? orders.filter((o) => o.status === st).length : orders.length;
      const d = document.createElement("button"); d.type = "button";
      d.className = "stat" + (statusFilter === st ? " on" : "");
      d.innerHTML = "<small></small><b></b>";
      d.querySelector("small").textContent = label;
      d.querySelector("b").textContent = n;
      d.addEventListener("click", () => { statusFilter = st; renderStats(); renderOrders(); });
      box.appendChild(d);
    }
  }

  function renderOrders(flashId) {
    const q = $("search").value.trim().toLowerCase();
    const list = orders.filter((o) =>
      (!statusFilter || o.status === statusFilter) &&
      (!q || [o.name, o.phone, o.wilaya, o.commune].join(" ").toLowerCase().includes(q)));
    const tb = $("orders"); tb.innerHTML = "";
    if (!list.length) { tb.innerHTML = '<tr><td colspan="9" class="empty">ما كاين حتى طلبية.</td></tr>'; return; }

    for (const o of list) {
      const tr = tb.insertRow();
      if (o.id === flashId) tr.className = "flash";
      const date = new Date(o.created_at);

      // نستعملو textContent ديما باش حتى كود HTML من الزبون ما يتنفذ
      cell(tr, date.toLocaleDateString("fr-DZ"), date.toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" }), "ltr");
      cell(tr, o.name, o.notes || "");
      const ph = tr.insertCell(); ph.className = "phone ltr";
      const a = document.createElement("a"); a.href = "tel:" + o.phone; a.textContent = o.phone; ph.appendChild(a);
      const wa = document.createElement("a"); wa.className = "wa"; wa.target = "_blank"; wa.rel = "noopener";
      wa.href = "https://wa.me/213" + String(o.phone || "").replace(/^0/, ""); wa.textContent = "واتساب"; ph.appendChild(wa);
      cell(tr, o.wilaya, [o.commune, o.address].filter(Boolean).join(" · "));
      const dl = tr.insertCell();
      if (o.delivery_type) { const pill = document.createElement("span"); pill.className = "pill" + (o.delivery_type === "Bureau" ? " bureau" : ""); pill.textContent = o.delivery_type === "Bureau" ? "مكتب" : "منزل"; dl.appendChild(pill); }
      cell(tr, o.product || "", ["× " + (o.quantity || 1), o.color, o.size].filter(Boolean).join(" · "));
      cell(tr, fmt(o.price));
      tr.insertCell().appendChild(statusSelect(o));
      const del = document.createElement("button"); del.className = "abtn danger"; del.textContent = "حذف";
      del.setAttribute("aria-label", "حذف طلبية " + o.name); del.addEventListener("click", () => deleteOrder(o));
      tr.insertCell().appendChild(del);
    }
  }

  function cell(tr, main, sub, cls) {
    const td = tr.insertCell();
    if (cls) td.className = cls;
    td.append(document.createTextNode(main ?? ""));
    if (sub) { const s = document.createElement("small"); s.textContent = sub; td.appendChild(s); }
  }

  // القائمة المنسدلة تاع الحالة: التبديل يتحفظ في Supabase
  function statusSelect(o) {
    const wrap = document.createElement("span");
    const sel = document.createElement("select"); sel.className = "status";
    const mark = document.createElement("span"); mark.className = "saved";
    STATUSES.forEach((s) => sel.add(new Option(s, s)));
    sel.value = o.status; sel.dataset.s = o.status;
    sel.addEventListener("change", async () => {
      const before = o.status, after = sel.value;
      sel.disabled = true; mark.textContent = "…";
      const { error } = await db.from("orders").update({ status: after }).eq("id", o.id);
      sel.disabled = false;
      if (error) { sel.value = before; mark.textContent = "لم تُحفظ"; showError("الحالة ما تحفظتش: " + error.message); return; }
      o.status = after; sel.dataset.s = after; mark.textContent = "✓";
      setTimeout(() => (mark.textContent = ""), 1500);
      renderStats();
    });
    wrap.append(sel, mark);
    return wrap;
  }

  async function deleteOrder(o) {
    if (!confirm("تحذف الطلبية تاع " + o.name + "؟")) return;
    const { error } = await db.from("orders").delete().eq("id", o.id);
    if (error) { showError("ما تحذفتش: " + error.message); return; }
    orders = orders.filter((x) => x.id !== o.id);
    renderStats(); renderOrders();
  }

  $("search").addEventListener("input", () => renderOrders());
  $("refreshBtn").addEventListener("click", () => { loadOrders(); loadProducts(); });

  // ---------- 5) المنتجات ----------
  async function loadProducts() {
    const { data, error } = await db.from("products").select("*").order("id");
    if (error) { showError("ما قدرناش نجيبو المنتجات: " + error.message); return; }
    hasProductCols = !!(data.length && "category" in data[0]);
    const tb = $("products"); tb.innerHTML = "";
    if (!data.length) { tb.innerHTML = '<tr><td colspan="12" class="empty">ما كاين حتى منتج. زيدي واحد من الفوق.</td></tr>'; return; }
    for (const p of data) {
      const tr = tb.insertRow();
      tr.insertCell().textContent = p.id;
      const th = tr.insertCell();
      if (p.image_url) { const im = document.createElement("img"); im.className = "thumb"; im.src = p.image_url; im.alt = ""; im.loading = "lazy"; th.appendChild(im); }
      const name = input(tr, p.name), desc = input(tr, p.description || "");
      const cat = document.createElement("select");
      CATS.forEach(([v, l]) => cat.add(new Option(l, v)));
      cat.value = p.category || ""; cat.disabled = !hasProductCols;
      tr.insertCell().appendChild(cat);
      const price = input(tr, p.price, "number"), old = input(tr, p.old_price ?? "", "number");
      const img = input(tr, p.image_url || "", "url"); img.classList.add("ltr");
      const isNew = check(tr, p.is_new, !hasProductCols), best = check(tr, p.is_bestseller, !hasProductCols), act = check(tr, p.active);
      const save = document.createElement("button"); save.className = "abtn"; save.textContent = "حفظ";
      save.addEventListener("click", async () => {
        save.disabled = true;
        const row = {
          name: name.value.trim(), description: desc.value.trim() || null,
          price: Number(price.value), old_price: old.value === "" ? null : Number(old.value),
          image_url: img.value.trim() || null, active: act.checked
        };
        if (hasProductCols) Object.assign(row, { category: cat.value || null, is_new: isNew.checked, is_bestseller: best.checked });
        const { error } = await db.from("products").update(row).eq("id", p.id);
        save.disabled = false;
        save.textContent = error ? "لم يُحفظ" : "✓ تحفظ";
        if (error) showError("المنتج ما تحفظش: " + error.message);
        setTimeout(() => (save.textContent = "حفظ"), 1500);
      });
      tr.insertCell().appendChild(save);
    }
  }

  function check(tr, value, disabled) {
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!value; c.disabled = !!disabled;
    tr.insertCell().appendChild(c); return c;
  }

  function input(tr, value, type) {
    const i = document.createElement("input"); if (type) i.type = type; i.value = value;
    tr.insertCell().appendChild(i); return i;
  }

  $("addProduct").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const row = {
      name: f.get("name").trim(), price: Number(f.get("price")),
      old_price: f.get("old_price") ? Number(f.get("old_price")) : null,
      image_url: f.get("image_url") || null
    };
    if (hasProductCols && f.get("category")) row.category = f.get("category");
    const { error } = await db.from("products").insert(row);
    if (error) { showError("المنتج ما تزادش: " + error.message); return; }
    e.target.reset(); loadProducts();
  });

  CATS.forEach(([v, l]) => $("addCat").add(new Option(v ? l : "الفئة", v)));

  // ---------- 6) التحديث المباشر (Realtime) ----------
  let channel = null, timer = null;
  function stopLive() { if (channel) { db.removeChannel(channel); channel = null; } }
  function startLive() {
    stopLive();
    channel = db.channel("orders-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, (payload) => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
          await loadOrders();
          if (payload.eventType === "INSERT") {
            renderOrders(payload.new && payload.new.id);
            document.title = "● طلبية جديدة | LALLA";
            setTimeout(() => (document.title = "لوحة التحكم | LALLA"), 4000);
          }
        }, 300);
      })
      .subscribe((s) => {
        const l = $("live");
        if (s === "SUBSCRIBED") { l.textContent = "مباشر"; l.className = "live on"; }
        else if (["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(s)) { l.textContent = "غير متصل"; l.className = "live off"; }
      });
  }

  // ---------- 7) أول ما تتحل الصفحة ----------
  db.auth.getSession().then(({ data }) => showDash(!!data.session));
</script>
</body>
</html>
