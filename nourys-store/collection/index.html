<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>المجموعة | LALLA</title>
  <meta name="description" content="كل إكسسوارات LALLA: حقائب، مجوهرات، ساعات، نظارات وأوشحة. الدفع عند الاستلام.">
  <meta name="theme-color" content="#4B1E3A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%234B1E3A'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23E9CFA0'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/lalla.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <style>
    .page-head{padding-block:32px 8px;display:grid;gap:6px}
    .page-head h1{font-size:clamp(34px,6vw,54px)}
    .page-head p{color:var(--muted)}
    .toolbar{position:sticky;top:64px;z-index:5;background:var(--ivory);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:24px}
    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px;min-width:0;flex:1 1 100%}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #D9C7BA;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
    .chip:hover{border-color:var(--plum)}
    .chip[aria-pressed="true"]{background:var(--plum);color:#FFF8F2;border-color:var(--plum)}
    .sort{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
    .sort select{min-height:44px;width:auto;padding:0 12px}
    .count{font-size:14px;color:var(--muted)}
    @media (min-width:900px){.chips{flex:1 1 auto}}
  </style>
</head>
<body data-root="..">
  <div id="site-header"></div>

  <main id="main" class="wrap">
    <div class="page-head">
      <span class="eyebrow">La collection</span>
      <h1 id="title">كل المجموعة</h1>
      <p>اختاري الفئة، ورتّبي حسب السعر.</p>
    </div>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="الفئات"></div>
      <span class="count" id="count" aria-live="polite"></span>
      <label class="sort" for="sort">ترتيب
        <select class="input" id="sort">
          <option value="new">الأحدث</option>
          <option value="best">الأكثر طلبًا</option>
          <option value="asc">السعر: من الأقل</option>
          <option value="desc">السعر: من الأعلى</option>
        </select>
      </label>
    </div>

    <div class="grid g4" id="grid"></div>
    <div id="msg"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/lalla.js"></script>
  <script>
    (function () {
      const { el, card, skeletons, loadProducts, CATEGORIES, catOf } = LALLA;
      const params = new URLSearchParams(location.search);
      let cat = catOf(params.get("cat")) ? params.get("cat") : "";
      const sortSel = document.getElementById("sort");
      if (["new", "best", "asc", "desc"].includes(params.get("sort"))) sortSel.value = params.get("sort");
      let all = [];

      const chips = document.getElementById("chips");
      [{ key: "", ar: "الكل" }].concat(CATEGORIES).forEach((c) => {
        const b = el("button", "chip", c.ar); b.type = "button"; b.dataset.key = c.key;
        b.addEventListener("click", () => { cat = c.key; sync(); render(); });
        chips.appendChild(b);
      });

      function sync() {
        chips.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === cat)));
        const c = catOf(cat);
        document.getElementById("title").textContent = c ? c.ar : "كل المجموعة";
        document.title = (c ? c.ar : "المجموعة") + " | LALLA";
        const q = new URLSearchParams();
        if (cat) q.set("cat", cat);
        if (sortSel.value !== "new") q.set("sort", sortSel.value);
        history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
      }

      function render() {
        const grid = document.getElementById("grid"), msg = document.getElementById("msg");
        let list = all.filter((p) => !cat || p.category === cat);
        const s = sortSel.value;
        if (s === "asc") list.sort((a, b) => a.price - b.price);
        else if (s === "desc") list.sort((a, b) => b.price - a.price);
        else if (s === "best") list.sort((a, b) => (b.is_bestseller ? 1 : 0) - (a.is_bestseller ? 1 : 0) || b.id - a.id);
        else list.sort((a, b) => (b.is_new ? 1 : 0) - (a.is_new ? 1 : 0) || b.id - a.id);
        grid.innerHTML = "";
        list.forEach((p) => grid.appendChild(card(p)));
        document.getElementById("count").textContent = list.length + " قطعة";
        msg.innerHTML = list.length ? "" : '<p class="msg-box">ما كاين حتى قطعة في هذه الفئة حاليًا. <button class="chip" type="button" id="showAll">عرض الكل</button></p>';
        const sa = document.getElementById("showAll");
        if (sa) sa.addEventListener("click", () => { cat = ""; sync(); render(); });
      }

      sortSel.addEventListener("change", () => { sync(); render(); });
      sync();
      document.getElementById("grid").appendChild(skeletons(8));

      loadProducts().then((data) => { all = data; render(); }).catch(() => {
        document.getElementById("grid").innerHTML = "";
        document.getElementById("msg").innerHTML = '<p class="msg-box">ما قدرناش نجيبو المنتجات. حدّثي الصفحة بعد لحظة.</p>';
      });
    })();
  </script>
</body>
</html>
