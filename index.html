<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NOURYS | لوحة التاجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#042F35;--deep:#053B42;--teal:#0C6873;--teal2:#10808A;--acc:#3FD1C6;--light:#BBE8EC;--txt:#E9FBFA;--muted:#9FCFD4;--card:#07454D;--line:#0E5B64;--red:#FF7A7A;--ok:#5BE3A0;--warn:#FFD36B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,sans-serif}
a{color:var(--acc)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.5px}
.brand b{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
input,select,textarea{width:100%;background:var(--deep);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.btn{background:var(--acc);color:#04302F}
.btn.ghost{background:transparent;color:var(--light);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.err{color:var(--red)}.msg.ok{color:var(--ok)}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth .card{width:100%;max-width:400px}
.tabs{display:flex;gap:6px;margin:16px 0 4px}
.tabs button{flex:1;background:var(--deep);color:var(--muted)}
.tabs button.on{background:var(--teal);color:var(--txt)}
/* app */
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav.views{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
nav.views button{background:var(--deep);color:var(--muted)}
nav.views button.on{background:var(--teal);color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:26px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.toolbar select,.toolbar input{flex:1;min-width:140px}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.order .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.order .name{font-weight:700;font-size:16px}
.order .meta{color:var(--muted);font-size:13px;margin-top:2px}
.order select{width:auto;min-width:170px;padding:7px 10px;font-size:14px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--deep);border:1px solid var(--line)}
.s-new{color:var(--light)}.s-confirmed{color:var(--acc)}.s-shipped,.s-out_for_delivery{color:var(--warn)}.s-delivered{color:var(--ok)}.s-returned,.s-cancelled{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.key{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--deep);border:1px dashed var(--line);border-radius:10px;padding:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="auth hidden">
  <div class="card">
    <div class="brand">NOURY<b>S</b></div>
    <div style="color:var(--muted);font-size:14px;margin-top:4px">لوحة التحكم تاع التاجر</div>
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">دخول</button>
      <button id="tabSignup" type="button">حساب جديد</button>
    </div>
    <form id="authForm">
      <div id="storeField" class="hidden">
        <label for="storeName">اسم المتجر</label>
        <input id="storeName" autocomplete="organization">
      </div>
      <label for="email">الإيميل</label>
      <input id="email" type="email" required autocomplete="email" dir="ltr">
      <label for="password">كلمة السر</label>
      <input id="password" type="password" required minlength="8" autocomplete="current-password" dir="ltr">
      <button class="btn" style="width:100%;margin-top:16px" id="authBtn">دخول</button>
      <div id="authMsg" class="msg"></div>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header class="top">
    <div class="brand">NOURY<b>S</b></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="whoStore" style="color:var(--muted);font-size:14px"></span>
      <button class="btn ghost small" id="logoutBtn">خروج</button>
    </div>
  </header>
  <div class="wrap">
    <nav class="views">
      <button data-v="orders" class="on">الطلبيات</button>
      <button data-v="add">زيد طلبية</button>
      <button data-v="settings">الإعدادات</button>
    </nav>

    <!-- orders -->
    <div id="v-orders">
      <div class="stats">
        <div class="stat"><div class="n" id="stToday">0</div><div class="l">طلبيات اليوم</div></div>
        <div class="stat"><div class="n" id="stDelivered">0</div><div class="l">وصلت</div></div>
        <div class="stat"><div class="n" id="stReturned">0</div><div class="l">روتور</div></div>
        <div class="stat"><div class="n" id="stRate">—</div><div class="l">نسبة التوصيل</div></div>
      </div>
      <div class="toolbar">
        <select id="filterStatus"><option value="">كل الحالات</option></select>
        <input id="search" placeholder="ابحث بالاسم ولا الهاتف">
        <button class="btn ghost small" id="refreshBtn">تحديث</button>
      </div>
      <div id="orderList"></div>
    </div>

    <!-- add -->
    <div id="v-add" class="hidden">
      <form id="addForm" class="card">
        <div class="grid2">
          <div><label for="aName">اسم الزبون *</label><input id="aName" required></div>
          <div><label for="aPhone">الهاتف *</label><input id="aPhone" required inputmode="tel" dir="ltr" placeholder="05xxxxxxxx"></div>
          <div><label for="aWilaya">الولاية</label><input id="aWilaya"></div>
          <div><label for="aCommune">البلدية</label><input id="aCommune"></div>
          <div><label for="aProduct">المنتج</label><input id="aProduct"></div>
          <div class="grid2" style="gap:0 8px">
            <div><label for="aQty">الكمية</label><input id="aQty" type="number" min="1" value="1"></div>
            <div><label for="aPrice">الثمن (دج)</label><input id="aPrice" type="number" min="0" step="any"></div>
          </div>
        </div>
        <label for="aNotes">ملاحظات</label>
        <textarea id="aNotes" rows="2"></textarea>
        <button class="btn" style="margin-top:14px">حفظ الطلبية</button>
        <div id="addMsg" class="msg"></div>
      </form>
    </div>

    <!-- settings -->
    <div id="v-settings" class="hidden">
      <form id="setForm" class="card">
        <label for="sStore">اسم المتجر</label><input id="sStore">
        <div class="grid2">
          <div><label for="sPhone">هاتف المتجر</label><input id="sPhone" dir="ltr" inputmode="tel"></div>
          <div><label for="sWa">رقم الواتساب</label><input id="sWa" dir="ltr" inputmode="tel"></div>
        </div>
        <button class="btn" style="margin-top:14px">حفظ</button>
        <div id="setMsg" class="msg"></div>
      </form>
      <div class="card" style="margin-top:12px">
        <div style="font-weight:700">مفتاح الربط تاع متجرك</div>
        <div style="color:var(--muted);font-size:13px;margin:4px 0 10px">نستعملوه باش نربطو متجرك (Shopify، WooCommerce، ولا صفحة الهبوط) بـ NOURYS. ما تعطيه لحتى واحد.</div>
        <div class="key" id="apiKey">…</div>
        <div style="color:var(--muted);font-size:13px;margin-top:8px">الخطة: <span id="plan" class="pill"></span></div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://dwphyhykervbxcllkqip.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3cGh5aHlrZXJ2YnhjbGxrcWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTkyMTksImV4cCI6MjEwOTE3NTIxOX0.AQJMwILg2fTLy46vecCus86eyCSgR-n9ipqgkKOBkrs';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const STATUS = {
  new:'جديدة', confirmed:'مؤكدة', shipped:'خرجت', out_for_delivery:'عند الليفرور',
  delivered:'وصلت', returned:'روتور', cancelled:'ملغاة'
};
const $ = id => document.getElementById(id);
let user = null, orders = [], mode = 'login';

function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  kids.forEach(k => k && e.append(k));
  return e;
}
function msg(id, text, ok){ const m = $(id); m.textContent = text || ''; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

/* ---------- auth ---------- */
function setMode(m){
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabSignup').classList.toggle('on', m === 'signup');
  $('storeField').classList.toggle('hidden', m !== 'signup');
  $('authBtn').textContent = m === 'login' ? 'دخول' : 'خلق الحساب';
  $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  msg('authMsg', '');
}
$('tabLogin').onclick = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  $('authBtn').disabled = true;
  try {
    if (mode === 'signup') {
      const { data, error } = await db.auth.signUp({
        email, password,
        options: { data: { store_name: $('storeName').value.trim() }, emailRedirectTo: location.origin + location.pathname }
      });
      if (error) throw error;
      if (!data.session) { msg('authMsg', 'تم ✅ افتح الإيميل تاعك وأكّد الحساب، ومن بعد ادخل.', true); setMode('login'); msg('authMsg','تم ✅ افتح الإيميل تاعك وأكّد الحساب، ومن بعد ادخل.', true); }
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    const t = String(err.message || err);
    msg('authMsg',
      /Invalid login/i.test(t) ? 'الإيميل ولا كلمة السر غالطين.' :
      /not confirmed/i.test(t) ? 'لازم تأكد الإيميل قبل ما تدخل.' :
      /already registered/i.test(t) ? 'هذا الإيميل عندو حساب، ادخل بيه.' :
      /least/i.test(t) ? 'كلمة السر لازم 8 حروف على الأقل.' : 'صرا خطأ: ' + t);
  } finally { $('authBtn').disabled = false; }
};

$('logoutBtn').onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_ev, session) => {
  user = session?.user || null;
  $('auth').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  if (user) { loadProfile(); loadOrders(); }
});

/* ---------- views ---------- */
document.querySelectorAll('nav.views button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.views button').forEach(x => x.classList.toggle('on', x === b));
  ['orders','add','settings'].forEach(v => $('v-' + v).classList.toggle('hidden', v !== b.dataset.v));
});

/* ---------- orders ---------- */
Object.entries(STATUS).forEach(([k,v]) => $('filterStatus').append(el('option', { value:k, text:v })));
$('filterStatus').onchange = renderOrders;
$('search').oninput = renderOrders;
$('refreshBtn').onclick = loadOrders;

async function loadOrders(){
  const { data, error } = await db.from('orders').select('*').order('created_at', { ascending:false }).limit(500);
  if (error) { $('orderList').replaceChildren(el('div', { class:'empty', text:'ما قدرناش نجيبو الطلبيات: ' + error.message })); return; }
  orders = data; renderStats(); renderOrders();
}

function renderStats(){
  const today = new Date().toDateString();
  const del = orders.filter(o => o.status === 'delivered').length;
  const ret = orders.filter(o => o.status === 'returned').length;
  $('stToday').textContent = orders.filter(o => new Date(o.created_at).toDateString() === today).length;
  $('stDelivered').textContent = del;
  $('stReturned').textContent = ret;
  $('stRate').textContent = (del + ret) ? Math.round(del * 100 / (del + ret)) + '%' : '—';
}

function renderOrders(){
  const f = $('filterStatus').value, q = $('search').value.trim().toLowerCase();
  const list = orders.filter(o => (!f || o.status === f) &&
    (!q || (o.customer_name || '').toLowerCase().includes(q) || (o.customer_phone || '').includes(q)));
  if (!list.length) { $('orderList').replaceChildren(el('div', { class:'empty', text: orders.length ? 'ما كاين حتى طلبية بهذا البحث.' : 'مازال ما عندك حتى طلبية. زيد وحدة من "زيد طلبية".' })); return; }
  $('orderList').replaceChildren(...list.map(orderCard));
}

function orderCard(o){
  const sel = el('select', { 'aria-label':'حالة الطلبية' });
  Object.entries(STATUS).forEach(([k,v]) => { const op = el('option', { value:k, text:v }); if (k === o.status) op.selected = true; sel.append(op); });
  sel.onchange = async () => {
    sel.disabled = true;
    const { error } = await db.from('orders').update({ status: sel.value }).eq('id', o.id);
    sel.disabled = false;
    if (error) { alert('ما تبدلتش الحالة: ' + error.message); sel.value = o.status; return; }
    o.status = sel.value; pill.className = 'pill s-' + o.status; pill.textContent = STATUS[o.status]; renderStats();
  };
  const pill = el('span', { class:'pill s-' + o.status, text: STATUS[o.status] || o.status });
  const where = [o.wilaya, o.commune].filter(Boolean).join(' · ');
  const what = [o.product, o.quantity > 1 ? '×' + o.quantity : '', o.total_price != null ? Number(o.total_price).toLocaleString('fr-DZ') + ' دج' : ''].filter(Boolean).join(' ');
  return el('div', { class:'order' },
    el('div', { class:'row' },
      el('div', {},
        el('div', { class:'name', text: o.customer_name }),
        el('div', { class:'meta', dir:'ltr', style:'text-align:right', text: o.customer_phone }),
        where && el('div', { class:'meta', text: where }),
        what && el('div', { class:'meta', text: what }),
        el('div', { class:'meta', text: '#' + o.id + ' · ' + new Date(o.created_at).toLocaleString('fr-DZ') })
      ),
      el('div', { style:'display:flex;flex-direction:column;gap:8px;align-items:flex-end' }, pill, sel)
    )
  );
}

/* ---------- add order ---------- */
$('addForm').onsubmit = async e => {
  e.preventDefault();
  const row = {
    merchant_id: user.id,
    customer_name: $('aName').value.trim(),
    customer_phone: $('aPhone').value.trim(),
    wilaya: $('aWilaya').value.trim() || null,
    commune: $('aCommune').value.trim() || null,
    product: $('aProduct').value.trim() || null,
    quantity: parseInt($('aQty').value, 10) || 1,
    total_price: $('aPrice').value === '' ? null : Number($('aPrice').value),
    notes: $('aNotes').value.trim() || null
  };
  const { error } = await db.from('orders').insert(row);
  if (error) return msg('addMsg', 'ما تسجلتش: ' + error.message);
  msg('addMsg', 'تسجلت الطلبية ✅', true);
  e.target.reset(); $('aQty').value = 1;
  loadOrders();
};

/* ---------- settings ---------- */
async function loadProfile(){
  const { data, error } = await db.from('merchants').select('*').eq('id', user.id).single();
  if (error) return;
  $('whoStore').textContent = data.store_name || user.email;
  $('sStore').value = data.store_name || '';
  $('sPhone').value = data.phone || '';
  $('sWa').value = data.whatsapp || '';
  $('apiKey').textContent = data.api_key;
  $('plan').textContent = { trial:'تجربة', active:'مفعّلة', paused:'موقوفة' }[data.plan] || data.plan;
}
$('setForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.from('merchants').update({
    store_name: $('sStore').value.trim(), phone: $('sPhone').value.trim(), whatsapp: $('sWa').value.trim()
  }).eq('id', user.id);
  if (error) return msg('setMsg', 'ما تحفظش: ' + error.message);
  msg('setMsg', 'تحفظ ✅', true); loadProfile();
};

setMode('login');
db.auth.getSession().then(({ data }) => { if (!data.session) $('auth').classList.remove('hidden'); });
</script>
</body>
</html>
