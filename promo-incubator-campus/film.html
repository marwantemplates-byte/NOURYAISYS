<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حاضنة الأعمال — campus model film</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--olive:#1f3d2b;--emerald:#2e6b4a;--gold:#c9a24b;--goldL:#e8d5a3;--goldD:#8a6a24;--ivory:#faf7f0;--ink:#1c1b19}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#8d7a66}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 100% at 50% 30%,#a6835f 0%,#8f6d4e 60%,#735740 100%);font-family:Tajawal,sans-serif;color:var(--ink)}
.vp{position:absolute;inset:0;perspective:2000px;perspective-origin:50% 50%}
.world{position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;backface-visibility:hidden}
.v{backface-visibility:visible}
canvas.f{display:block}
/* tilt-shift bands (blur what is behind them, never the labels layer) */
.ts{position:absolute;left:0;right:0;pointer-events:none}
/* paper labels */
.lab{position:absolute;left:0;top:0;transform-style:preserve-3d}
.card{position:absolute;left:0;bottom:0;transform:translateX(-50%);background:#fffefa;border-radius:6px;white-space:nowrap;text-align:center;color:#1c1b19;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 0 0 1px rgba(80,70,55,.07),0 18px 34px rgba(60,45,30,.22);backface-visibility:hidden}
.card .t{font-family:'Reem Kufi';font-weight:700;line-height:1.25}
.card .s{font-family:Tajawal;font-weight:700;line-height:1.35;color:#2b2925}
.post{position:absolute;bottom:0;width:7px;margin-left:-3.5px;border-radius:3px;background:linear-gradient(90deg,#5d554c,#8b8177 45%,#4a433c)}
.rule{height:2px;background:#d8d2c6;margin:10px auto}
/* overlays */
#flare{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,rgba(255,252,242,1) 0%,rgba(255,248,232,.85) 22%,rgba(255,244,222,.35) 48%,rgba(255,240,215,0) 72%)}
#wash{position:absolute;inset:0;pointer-events:none;background:var(--ivory);opacity:0}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 48%,rgba(0,0,0,0) 58%,rgba(40,28,15,.28) 100%)}
#grain{position:absolute;inset:-64px;pointer-events:none;opacity:.075;mix-blend-mode:overlay}
#warm{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,214,150,.10),rgba(255,214,150,0) 45%,rgba(40,60,90,.06));mix-blend-mode:soft-light}
#brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:1}
#brand .mk{width:150px;height:150px;border-radius:36px;background:var(--olive);display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi';font-weight:700;font-size:92px;color:var(--goldL);box-shadow:0 18px 40px rgba(31,61,43,.28),inset 0 0 0 3px rgba(201,162,75,.55)}
#brand .ttl{margin-top:34px;font-family:'Reem Kufi';font-weight:700;font-size:150px;line-height:1.1;color:var(--olive);white-space:nowrap}
#brand .ttl .w{display:inline-block}
#brand .gr{width:520px;height:6px;margin-top:22px;border-radius:3px;background:linear-gradient(90deg,rgba(201,162,75,0),var(--gold) 18%,var(--gold) 82%,rgba(201,162,75,0))}
#brand .uni{margin-top:26px;font-family:Tajawal;font-weight:700;font-size:50px;color:#2a2925;white-space:nowrap}
#brand .pill{margin-top:44px;padding:16px 58px 20px;border-radius:999px;background:var(--gold);font-family:Tajawal;font-weight:700;font-size:48px;color:var(--ink);box-shadow:0 14px 30px rgba(138,106,36,.28);white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-10%" y="0" width="120%" height="100%"><feGaussianBlur id="mbB" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div class="vp" id="vp1"><div class="world" id="world"></div></div>
  <div class="ts" id="tsT1" style="top:0;height:300px;backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(#000 25%,transparent)"></div>
  <div class="ts" id="tsT2" style="top:0;height:170px;backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(#000 20%,transparent)"></div>
  <div class="ts" id="tsB1" style="bottom:0;height:300px;backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(0deg,#000 25%,transparent)"></div>
  <div class="ts" id="tsB2" style="bottom:0;height:170px;backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(0deg,#000 20%,transparent)"></div>
  <div id="warm"></div>
  <div class="vp" id="vp2"><div class="world" id="world2"></div></div>
  <div id="vign"></div>
  <div id="flare"></div>
  <div id="wash"></div>
  <div id="brand">
    <div class="mk" id="bMk">ح</div>
    <div class="ttl" id="bTtl"><span class="w">حاضنة</span> <span class="w">الأعمال</span></div>
    <div class="gr" id="bGr"></div>
    <div class="uni" id="bUni">جامعة الأمير عبد القادر للعلوم الإسلامية — قسنطينة</div>
    <div class="pill" id="bPill">سجّل الآن على المنصة</div>
  </div>
  <div id="grain"></div>
</div>
<script src="script.js"></script>
</body>
</html>
